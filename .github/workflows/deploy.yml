name: Build & Deploy API to Azure App Service

on:
  push:
    branches: [ "main" ]   # Se ejecuta al hacer push a la rama main
  workflow_dispatch:        # Permite lanzarlo manualmente desde GitHub Actions

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read   # 👈 necesario para descargar common-lib desde GitHub Packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API
        run: mvn -B package -DskipTests

      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}          # Nombre de tu App Service en Azure
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}  # XML con credenciales
          package: target/*.jar    # Ajusta si tu jar tiene otro nombre
