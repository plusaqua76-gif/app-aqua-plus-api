name: Cleanup Artifacts and Old Runs (Keep 2 Dias)

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  cleanup:
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete artifacts older than 2 days
        uses: actions/github-script@v7
        with:
          script: |
            const maxAge = 2 * 24 * 60 * 60 * 1000; // 2 días
            const now = new Date();

            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            for (const artifact of artifacts.data.artifacts) {
              const created = new Date(artifact.created_at);
              if (now - created > maxAge) {
                console.log(`Deleting artifact: ${artifact.name}`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            }

      - name: Delete workflow runs older than 2 days
        uses: actions/github-script@v7
        with:
          script: |
            const maxAge = 2 * 24 * 60 * 60 * 1000; // 2 días
            const now = new Date();

            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            for (const run of runs.data.workflow_runs) {
              const created = new Date(run.created_at);
              if (now - created > maxAge) {
                console.log(`Deleting run ID: ${run.id}`);
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
              }
            }
